<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anon Space</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo-wrap">
    <div class="logo-anim">
      <span class="orb"></span>
      <span class="ring"></span>
    </div>
    <div class="logo-text">ANON SPACE</div>
  </div>
</header>

<main class="container">

  <div class="composer">
    <textarea id="text" placeholder="Say something..."></textarea>
    <div class="composer-bottom">
      <div></div>
      <button onclick="send()">Post</button>
    </div>
  </div>

  <div class="trending-section">
    <div class="trending-title">🔥 Trending Today</div>
    <div id="trending" class="trending-scroll"></div>
  </div>

  <div id="feed" class="feed"></div>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
