<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="brand">Freedom</div>
</header>

<main class="container">

  <div class="composer">
    <textarea id="text" placeholder="Say something..."></textarea>
    <div class="row">
      <span id="limit">0/3</span>
      <button onclick="send()">Post</button>
    </div>
  </div>

  <button class="random" onclick="randomPost()">🎲 Send to Random</button>

  <div id="feed" class="feed"></div>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
